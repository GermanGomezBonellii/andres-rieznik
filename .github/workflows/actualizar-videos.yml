name: Actualizar últimos videos de YouTube

# Lee el feed RSS público del canal (sin API ni claves) y, si hay videos
# nuevos, actualiza assets/data/latest-videos.json y lo sube al repo.
# GitHub Pages se republica solo con ese commit.
on:
  schedule:
    - cron: '17 */6 * * *'   # cada 6 horas
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-videos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leer el feed del canal
        run: node scripts/actualizar-videos.mjs
      - name: Guardar cambios (si los hay)
        run: |
          if git diff --quiet -- assets/data/latest-videos.json; then
            echo "Sin videos nuevos."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/latest-videos.json
            git commit -m "Actualizar últimos videos de YouTube"
            git push
          fi
